version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      astro: { patterns: ['astro', '@astrojs/*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      codeql: { patterns: ['github/codeql-action*'] }
