name: Sync shipped features

# Daily: when a tracked feature issue closes as completed, show it on the portfolio.
on:
  schedule:
    - cron: '15 1 * * *' # 07:00 Nepal time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-shipped.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit if anything shipped
        run: |
          git diff --quiet -- src/data/feature-tracker.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Portfolio: show newly shipped features"
          git push
