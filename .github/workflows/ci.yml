name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the build only needs to read the repo. Actions are pinned to commit SHAs (supply-chain hardening);
# Dependabot keeps the pins current.
permissions:
  contents: read # check out the code; nothing else

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
